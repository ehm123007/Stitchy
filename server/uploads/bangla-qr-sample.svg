<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#198754" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>
  
  <!-- Card Background -->
  <rect width="400" height="480" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Header Bar -->
  <rect width="400" height="64" rx="20" fill="url(#qrGrad)" />
  <rect y="44" width="400" height="20" fill="url(#qrGrad)" />
  
  <!-- Bangla QR Header Text -->
  <text x="200" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    বাংলা QR | BANGLA QR
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">
    STITCHY EXPORT APPAREL
  </text>
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
    Scan with any Bank App / bKash / Nagad / Rocket
  </text>
  
  <!-- QR Code Frame -->
  <rect x="60" y="130" width="280" height="280" rx="12" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="2" />
  
  <!-- Stylized QR Code Pattern (Scalable vector elements) -->
  <!-- Top Left Corner Box -->
  <rect x="85" y="155" width="60" height="60" rx="6" fill="#111827" />
  <rect x="95" y="165" width="40" height="40" rx="4" fill="#FAFAFA" />
  <rect x="105" y="175" width="20" height="20" rx="2" fill="#111827" />
  
  <!-- Top Right Corner Box -->
  <rect x="255" y="155" width="60" height="60" rx="6" fill="#111827" />
  <rect x="265" y="165" width="40" height="40" rx="4" fill="#FAFAFA" />
  <rect x="275" y="175" width="20" height="20" rx="2" fill="#111827" />
  
  <!-- Bottom Left Corner Box -->
  <rect x="85" y="325" width="60" height="60" rx="6" fill="#111827" />
  <rect x="95" y="335" width="40" height="40" rx="4" fill="#FAFAFA" />
  <rect x="105" y="345" width="20" height="20" rx="2" fill="#111827" />
  
  <!-- Grid data dots simulation -->
  <g fill="#1F2937">
    <rect x="160" y="155" width="14" height="14" rx="2"/>
    <rect x="185" y="155" width="14" height="28" rx="2"/>
    <rect x="210" y="155" width="28" height="14" rx="2"/>
    <rect x="160" y="180" width="14" height="14" rx="2"/>
    <rect x="225" y="180" width="14" height="28" rx="2"/>
    
    <rect x="85" y="230" width="14" height="28" rx="2"/>
    <rect x="110" y="230" width="28" height="14" rx="2"/>
    <rect x="110" y="255" width="14" height="14" rx="2"/>
    
    <rect x="155" y="220" width="28" height="28" rx="4"/>
    <rect x="195" y="210" width="20" height="20" rx="2"/>
    <rect x="195" y="240" width="40" height="14" rx="2"/>
    
    <rect x="250" y="230" width="28" height="14" rx="2"/>
    <rect x="290" y="230" width="25" height="40" rx="2"/>
    <rect x="260" y="255" width="18" height="28" rx="2"/>
    
    <rect x="160" y="275" width="14" height="30" rx="2"/>
    <rect x="185" y="270" width="30" height="14" rx="2"/>
    <rect x="225" y="275" width="15" height="15" rx="2"/>
    
    <rect x="160" y="325" width="28" height="14" rx="2"/>
    <rect x="200" y="325" width="14" height="28" rx="2"/>
    <rect x="225" y="325" width="30" height="14" rx="2"/>
    <rect x="270" y="325" width="45" height="14" rx="2"/>
    
    <rect x="160" y="350" width="14" height="35" rx="2"/>
    <rect x="185" y="365" width="28" height="20" rx="2"/>
    <rect x="225" y="355" width="14" height="30" rx="2"/>
    <rect x="250" y="355" width="35" height="15" rx="2"/>
    <rect x="295" y="355" width="20" height="30" rx="2"/>
  </g>
  
  <!-- Center National Logo Badge -->
  <circle cx="200" cy="270" r="26" fill="#FFFFFF" stroke="#0F5132" stroke-width="2.5" />
  <circle cx="200" cy="270" r="16" fill="#DC2626" />
  <text x="200" y="274" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">QR</text>
  
  <!-- Footer instructions & Logos -->
  <text x="200" y="432" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">
    All Bank Cards, bKash, Nagad, Rocket Accepted
  </text>
  <text x="200" y="452" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">
    Merchant ID: BD-QR-88017129841 • Interoperable QR
  </text>
</svg>
